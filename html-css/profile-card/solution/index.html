<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card - Solution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <article class="profile-card">
      <img src="https://i.pravatar.cc/150?img=5" alt="Profile photo" class="avatar">
      <h1 class="name">Maria Santos</h1>
      <p class="title">Frontend Developer</p>
      <p class="bio">I enjoy turning design mockups into accessible, responsive web pages.</p>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
      </ul>
      <div class="socials">
        <a href="#" aria-label="GitHub">GitHub</a>
        <a href="#" aria-label="LinkedIn">LinkedIn</a>
        <a href="#" aria-label="Twitter">Twitter</a>
      </div>
    </article>
  </main>
</body>
</html>
