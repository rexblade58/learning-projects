<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <article class="profile-card">
      <img src="https://i.pravatar.cc/150" alt="Profile photo" class="avatar">
      <h1 class="name">Jane Doe</h1>
      <p class="title">Web Developer</p>
      <p class="bio">Passionate about building clean, accessible web interfaces.</p>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
      <a href="mailto:jane@example.com" class="contact">Contact me</a>
    </article>
  </main>
</body>
</html>
